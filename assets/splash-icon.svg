<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    ReceiptSnap Splash icon · 1024×1024
    The receipt-with-R element only — no army-green background.
    Designed to sit centered on the cream `splash.backgroundColor` from
    app.json, so the launch screen reads as cream paper everywhere.
  -->

  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FBF8F0"/>
      <stop offset="100%" stop-color="#E8DEC7"/>
    </linearGradient>

    <filter id="rcptShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="16" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Receipt: same proportions as the app icon, centered -->
  <g transform="translate(232 142)" filter="url(#rcptShadow)">
    <path d="M 0 0
             L 560 0
             L 560 700
             L 540 720 L 520 700 L 500 720 L 480 700
             L 460 720 L 440 700 L 420 720 L 400 700
             L 380 720 L 360 700 L 340 720 L 320 700
             L 300 720 L 280 700 L 260 720 L 240 700
             L 220 720 L 200 700 L 180 720 L 160 700
             L 140 720 L 120 700 L 100 720 L 80 700
             L 60 720 L 40 700 L 20 720 L 0 700 Z"
          fill="url(#paper)"
          stroke="rgba(45, 60, 50, 0.10)"
          stroke-width="2"/>

    <line x1="60" y1="80" x2="500" y2="80"
          stroke="#8B8B7E" stroke-width="4" stroke-dasharray="12 8" opacity="0.55"/>
  </g>

  <text x="512" y="732"
        text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="660"
        font-weight="900"
        fill="#1F3A2D"
        letter-spacing="-20">R</text>
</svg>
